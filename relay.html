<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Digest relay</title>
<style>
  :root { --bg:#fff; --fg:#1d1c1d; --mut:#616061; --line:#e3e3e3; --ok:#2eb67d; --bad:#e01e5a; }
  @media (prefers-color-scheme:dark){ :root{ --bg:#1a1d21; --fg:#e8e8e8; --mut:#9a9a9a; --line:#35373b; } }
  *{box-sizing:border-box}
  body{background:var(--bg);color:var(--fg);font:14px/1.6 system-ui,-apple-system,sans-serif;margin:0;padding:24px 16px}
  main{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
  h1{font-size:17px;margin:0}
  .card{border:1px solid var(--line);border-left:4px solid var(--ok);border-radius:8px;padding:16px;background:transparent}
  .stats{display:flex;gap:20px;margin:12px 0}
  .stat .l{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut)}
  .stat .v{font-size:26px;font-weight:700}
  .up{color:var(--ok);font-size:13px;font-weight:600}
  .down{color:var(--bad);font-size:13px;font-weight:600}
  .flat{color:var(--mut);font-size:13px;font-weight:600}
  .prod{margin:6px 0}.prod b{display:block}.prod span{color:var(--mut);font-size:13px}
  .foot{border-top:1px solid var(--line);margin-top:12px;padding-top:10px;color:var(--mut);font-size:13px}
  input{padding:10px;border:1px solid var(--line);border-radius:6px;font:12px ui-monospace,Menlo,monospace;background:transparent;color:var(--fg);width:100%}
  button{padding:12px;border:0;border-radius:6px;background:#007a5a;color:#fff;font-weight:700;font-size:14px;cursor:pointer;width:100%}
  button:disabled{opacity:.6;cursor:default}
  #msg{padding:10px 12px;border-radius:6px;font-size:13px;display:none}
  .good{background:rgba(46,182,125,.12);color:var(--ok);display:block!important}
  .err{background:rgba(224,30,90,.12);color:var(--bad);display:block!important}
  .hint{color:var(--mut);font-size:12px}
</style>
<main>
  <h1>Digest relay</h1>
  <div id="empty" class="hint">No digest received. Click the BIMobject bookmarklet on the portal — it opens this page with the data.</div>
  <div id="preview"></div>
  <div id="msg"></div>
  <div id="controls" style="display:none;flex-direction:column;gap:10px">
    <input id="wh" placeholder="Slack webhook URL (stored in this browser only)" autocomplete="off" spellcheck="false">
    <button id="send">Send to Slack</button>
    <div class="hint">The webhook is saved in this browser's local storage. It is never put in a URL and never leaves this page except to Slack.</div>
  </div>
</main>
<script>
(function () {
  var KEY = 'relay-slack-webhook';
  var msg = document.getElementById('msg');
  function say(t, cls) { msg.textContent = t; msg.className = cls; }

  var raw = location.hash.slice(1);
  if (!raw) return;
  history.replaceState(null, '', location.pathname);   // keep the payload out of the address bar
  var payload;
  try { payload = JSON.parse(decodeURIComponent(escape(atob(raw)))); }
  catch (e) { say('Could not read the digest data: ' + e.message, 'err'); return; }

  document.getElementById('empty').style.display = 'none';
  document.getElementById('controls').style.display = 'flex';

  var s = payload.__summary || {};
  function tr(n) {
    var c = n > 0 ? 'up' : n < 0 ? 'down' : 'flat';
    var t = n > 0 ? '↑ ' + n + '%' : n < 0 ? '↓ ' + Math.abs(n) + '%' : '→ flat';
    return '<span class="' + c + '">' + t + '</span>';
  }
  function esc(x) { return String(x).replace(/[&<>]/g, function (c) { return ({'&':'&amp;','<':'&lt;','>':'&gt;'})[c]; }); }
  document.getElementById('preview').innerHTML =
    '<div class="card"><div style="font-weight:700;font-size:16px">' + esc(s.title || 'BIMobject') + '</div>' +
    '<div style="color:var(--mut);font-size:12px">' + esc(s.period || '') + '</div>' +
    '<div class="stats">' +
      '<div class="stat"><div class="l">Downloads</div><div class="v">' + esc(s.downloads) + ' ' + tr(s.dChange) + '</div></div>' +
      '<div class="stat"><div class="l">Page views</div><div class="v">' + esc(s.views) + ' ' + tr(s.vChange) + '</div></div>' +
    '</div>' +
    (s.products || []).map(function (p) {
      return '<div class="prod"><b>' + esc(p.name) + '</b><span>' + esc(p.downloads) + ' downloads · ' + esc(p.views) + ' views</span></div>';
    }).join('') +
    '<div class="foot"><b>Countries</b> ' + esc(s.countries || '') + '<br><b>Roles</b> ' + esc(s.roles || '') + '</div></div>';

  var wh = document.getElementById('wh');
  try { wh.value = localStorage.getItem(KEY) || ''; } catch (e) {}
  var btn = document.getElementById('send');

  btn.onclick = function () {
    var url = wh.value.trim();
    if (url.indexOf('https://hooks.slack.com/') !== 0) { say('That is not a Slack webhook URL.', 'err'); return; }
    try { localStorage.setItem(KEY, url); } catch (e) {}
    btn.disabled = true; say('Sending…', '');
    var body = JSON.stringify({ text: payload.text, blocks: payload.blocks });
    // text/plain keeps this a "simple" request (no preflight); Slack parses the body as JSON
    // and returns access-control-allow-origin:*, so the real response is readable here.
    fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=UTF-8' }, body: body })
      .then(function (r) { return r.text().then(function (t) { return { status: r.status, body: t }; }); })
      .then(function (res) {
        if (res.status === 200 && res.body.trim() === 'ok') { say('Posted to Slack.', 'good'); btn.textContent = 'Posted'; }
        else { say('Slack replied ' + res.status + ': ' + res.body, 'err'); btn.disabled = false; }
      })
      .catch(function (e) { say('Request failed: ' + e.message, 'err'); btn.disabled = false; });
  };
})();
</script>
</main>
</html>
